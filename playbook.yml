- hosts: webservers
  become: true
  roles:
    - role: geerlingguy.docker
    - role: geerlingguy.nginx
      vars:
        nginx_proxy_cache_path: "/var/cache/nginx keys_zone=my_cache:10m max_size=1g"
    - role: geerlingguy.certbot
      vars:
        certbot_auto_renew: true
        certbot_auto_renew_user: root
        certbot_auto_renew_hour: "3"
        certbot_auto_renew_minute: "30"
        certbot_auto_renew_options: "--quiet --deploy-hook 'systemctl reload nginx'"
        certbot_create_method: webroot
        certbot_create_if_missing: True
        certbot_admin_email: aleks.vedenev@gmail.com
        certbot_certs:
          - name: aleks-devops.ru
            webroot: "/var/www/html"
            domains:
              - aleks-devops.ru
              - www.aleks-devops.ru
    - role: nginx_config
    - role: ufw_rules

  tasks:
    - name: Add user to docker group
      ansible.builtin.user:
        name: "{{ user }}"
        create_home: true
        shell: /bin/bash
        groups: docker
        append: true




