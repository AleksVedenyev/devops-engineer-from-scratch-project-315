- hosts: all
  become: true
  collections:
    - community.docker

  pre_tasks:
    - name: Установка зависимостей для репозитория Docker
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present
        update_cache: yes

    - name: Создание директории для ключей APT
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Скачивание официального GPG-ключа Docker
      get_url:
        url: https://docker.com
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Добавление репозитория Docker в APT-источники
      apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://docker.com {{ ansible_distribution_release }} stable" # <-- ИСПРАВЛЕНО: правильный URL репозитория
        state: present
        filename: docker

    - name: Установка Docker Engine и Docker Compose
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        update_cache: yes

    - name: Проверка, что Docker запущен и включен в автозагрузку
      systemd:
        name: docker
        state: started
        enabled: yes


  roles:
    - role: geerlingguy.nginx
      vars:
        nginx_proxy_cache_path: "/var/cache/nginx keys_zone=my_cache:10m max_size=1g"
    - role: geerlingguy.certbot
      vars:
        certbot_auto_renew: true
        certbot_auto_renew_user: "{{ user | default(lookup('env', 'USER')) }}"
        certbot_auto_renew_hour: "3"
        certbot_auto_renew_minute: "30"
        certbot_auto_renew_options: "--quiet"
        certbot_create_if_missing: True
        certbot_admin_email: aleks.vedenev@gmail.com
        certbot_certs:
          - name: aleks-devops.ru
            domains:
              - aleks-devops.ru
              - www.aleks-devops.ru
        certbot_create_standalone_stop_services:
          - nginx

  tasks:
    - name: Remove default Nginx vhost
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent

    - name: Copy nginx conf file to remote host
      ansible.builtin.copy:
        src: files/my_domain.conf   
        dest: /etc/nginx/conf.d/my_domain.conf
        owner: root
        group: root
        mode: '0644'
      notify: Nginx reload

    - name: Add user to docker group
      ansible.builtin.user:
        name: "{{ user }}"
        create_home: true
        shell: /bin/bash
        groups: docker
        append: true

    - name: Deny everything and enable UFW
      community.general.ufw:
        policy: deny
        state: enabled

    - name: UFW allow SSH
      community.general.ufw:
        rule: allow
        port: '22'
        proto: tcp

    - name: UFW allow HTTP
      community.general.ufw:
        rule: allow
        port: '80'
        proto: tcp

    - name: UFW allow HTTPS
      community.general.ufw:
        rule: allow
        port: '443'
        proto: tcp
    
  handlers:
    - name: Nginx reload
      service:
        name: nginx
        state: reloaded
